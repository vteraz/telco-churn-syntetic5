services:
  # ── Сервіс для генерації даних (як раніше)
  generator:
    build: .
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: python src/generate_dataset_ext.py --samples 100000 --conv-samples 7500
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/data/telco_customers.csv && test -f /app/data/support_conversations.csv"]
      interval: 10s
      timeout: 5s
      retries: 3

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlartifacts:/mlartifacts
      - ./mlflow_db:/mlflow_db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  model_trainer:
    build:
      context: .
      dockerfile: Dockerfile.train
    volumes:
      - ./data:/data
      - ./mlartifacts:/mlartifacts
    environment:
      - DATA_PATH=/data/telco_customers.csv
      - MODEL_PATH=/data/churn_model.pkl
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - GIT_PYTHON_REFRESH=quiet
      - MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR=false
    command: ["python", "./pipelines/train.py"]
    depends_on:
      generator:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./mlartifacts:/mlartifacts
    depends_on:
      model_trainer:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    environment:
      - MODEL_PATH=/app/models/churn_model.pkl
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_MODEL_STAGE=champion
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

