name: Telco Churn ML Pipeline Vasyl Teraz Module 6

on:
    push:
        branches:
            - develop
            - 'module-**'
    workflow_dispatch: 
env:
    PYTHON_VERSION: "3.11"
    REGISTRY:  ghcr.io
    IMAGE:     ghcr.io/${{ github.repository }}/churn-api

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              name: Checkout
            - name: "Setup Python ${{ env.PYTHON_VERSION }} env"
              uses: actions/setup-python@v7
              with:
                python-version: ${{env.PYTHON_VERSION}}
                cache: 'pip'
                cache-dependency-path: 'requirements-dev.txt' # this will download cached deps into some folder
            - name: Show version
              run: python -c "import sys; print(sys.version)"
            - name: "Install dev dependencies"
              run: pip install --quiet -r requirements-dev.txt # this will install cached deps into the project workspace
            - name: Check code style with flake8
              run: flake8 src/ tests/ --max-line-length=1000 --ignore=E203,B007,F841,F811,W503,F401
            - name: Check code formatting with black
              run: black --check src/ tests/
            - name: Check DF schema with Pandera
              run: pytest tests/unit/test_schema.py -v --tb=short
            - name: Unit Tests
              run: |
                pytest tests/unit/test_features.py \
                -v --tb=short \
                --cov=src/features \
                --cov-report=xml:coverage-features.xml
            - name: Check model quality
              run: |
                pytest tests/unit/test_model.py \
                -v --tb=short -m slow \
                --cov=src/features --cov=src/models \
                --cov-report=xml:coverage-models.xml \
                --cov-fail-under=0
            - name: Publish coverage
              uses: codecov/codecov-action@v7
              if: always()
              with:
                files: coverage-features.xml,coverage-models.xml
                fail_ci_if_error: false
                token: ${{ secrets.CODECOV_TOKEN }}
    build-and-push:
      name: "Build and push docker image to registry"
      runs-on: ubuntu-latest
      if: github.event_name != 'pull_request'
      permissions:
        contents: read
        packages: write
      outputs:
        image-tag: ${{ steps.meta.outputs.tag }}
      steps:
        - uses: actions/checkout@v7
        - name: Login into registry
          uses: docker/login-action@v4
          with:
            registry: ${{env.REGISTRY}}
            username: ${{github.actor}}
            password: ${{secrets.GITHUB_TOKEN}}
        - name: Extract Docker metadata
          id: meta
          uses: docker/metadata-action@v6
          with:
            images: ${{ env.IMAGE }}
            tags: |
              type=sha,prefix=sha-,format=long
              type=ref,event=branch
              type=semver,pattern={{version}}
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Build and push
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to:   type=gha,mode=max
          