name: Telco Churn ML Pipeline Vasyl Teraz Module 6

on:
    push:
        branches:
            - develop
            - 'module-**'
    workflow_dispatch: 
env:
    PYTHON_VERSION: "3.11"

jobs:
    init:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              name: Checkout
            - name: "Setup Python ${{ env.PYTHON_VERSION }} env"
              uses: actions/setup-python@v7
              with:
                python-version: ${{env.PYTHON_VERSION}}
                cache: 'pip'
            - name: Show version
              run: python -c "import sys; print(sys.version)"
            - run: |
                ls -lah
                pip install -r requirements-dev.txt
              name: "Install dev dependencies"
    lint-and-test:
        needs: [init]
        runs-on: ubuntu-latest
        steps:
            - name: Show version
              run: |
                python -c "import sys; print(sys.version)"
                ls -lah


