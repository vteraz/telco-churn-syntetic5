name: Telco Churn ML Pipeline Vasyl Teraz Module 6

on:
    push:
        branches:
            - develop
            - 'module-**'
    workflow_dispatch: 
env:
    PYTHON_VERSION: "3.11"
    REGISTRY:  ghcr.io
    IMAGE:     ghcr.io/${{ github.repository }}/churn-api

jobs:
    lint-and-test:
        name: Lint and test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              name: Checkout
            - name: "Setup Python ${{ env.PYTHON_VERSION }} env"
              uses: actions/setup-python@v7
              with:
                python-version: ${{env.PYTHON_VERSION}}
                cache: 'pip'
                cache-dependency-path: 'requirements-dev.txt' # this will download cached deps into some folder
            - name: Show version
              run: python -c "import sys; print(sys.version)"
            - name: "Install dev dependencies"
              run: pip install --quiet -r requirements-dev.txt # this will install cached deps into the project workspace
            - name: Check code style with flake8
              run: flake8 src/ tests/ --max-line-length=1000 --ignore=E203,B007,F841,F811,W503,F401
            - name: Check code formatting with black
              run: black --check src/ tests/
            - name: Check DF schema with Pandera
              run: pytest tests/unit/test_schema.py -v --tb=short
            - name: Unit Tests
              run: |
                pytest tests/unit/test_features.py \
                -v --tb=short \
                --cov=src/features \
                --cov-report=xml:coverage-features.xml
            - name: Check model quality
              run: |
                pytest tests/unit/test_model.py \
                -v --tb=short -m slow \
                --cov=src/features --cov=src/models \
                --cov-report=xml:coverage-models.xml \
                --cov-fail-under=0
            - name: Publish coverage
              uses: codecov/codecov-action@v7
              if: always()
              with:
                files: coverage-features.xml,coverage-models.xml
                fail_ci_if_error: false
                token: ${{ secrets.CODECOV_TOKEN }}
    build-and-push:
      name: "Build and push docker image to registry"
      runs-on: ubuntu-latest
      if: github.event_name != 'pull_request'
      permissions:
        contents: read
        packages: write
      outputs:
        image-tag: ${{ steps.meta.outputs.tag }}
      steps:
        - uses: actions/checkout@v7
        
        - name: Login into registry
          uses: docker/login-action@v4
          with:
            registry: ${{env.REGISTRY}}
            username: ${{github.actor}}
            password: ${{secrets.GITHUB_TOKEN}}

        - name: Extract Docker metadata
          id: meta
          uses: docker/metadata-action@v6
          with:
            images: ${{ env.IMAGE }}
            tags: |
              type=sha,prefix=sha-,format=long
              type=ref,event=branch
              type=semver,pattern={{version}}
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Build and push
          uses: docker/build-push-action@v7
          with:
            context: .
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=gha
            cache-to:   type=gha,mode=max
    integration-tests:
      name: "Integration Tests (L1-L3)"
      needs: build-and-push
      runs-on: ubuntu-latest
      if: github.event_name != 'pull_request'
      permissions:
        contents: read
        packages: read

      steps:
        - uses: actions/checkout@v7

        - name: Log in to GHCR
          uses: docker/login-action@v4
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Run API container on runner
          run: |
            set -eux
            IMAGE_TAG="${{ env.IMAGE }}:sha-${{ github.sha }}"
            echo "Pulling $IMAGE_TAG"
            docker pull "$IMAGE_TAG"
            docker rm -f churn-api 2>/dev/null || true
            docker run -d \
              --name churn-api \
              -p 8000:8000 \
              -e MODEL_URI="${{ secrets.MLFLOW_TRACKING_URI }}" \
              -e MLFLOW_TRACKING_URI="${{ secrets.MLFLOW_TRACKING_URI }}" \
              "$IMAGE_TAG"
            # Wait for health (cold start can take a bit with uvicorn workers)
            for i in $(seq 1 45); do
              if curl -sf http://127.0.0.1:8000/health; then
                echo "API is healthy"
                curl -s http://127.0.0.1:8000/health || true
                exit 0
              fi
              echo "waiting... ($i)"
              # show logs early if container already exited
              if [ "$(docker inspect -f '{{.State.Running}}' churn-api 2>/dev/null || echo false)" != "true" ]; then
                echo "Container is not running"
                docker ps -a | head -20 || true
                docker logs churn-api || true
                exit 1
              fi
              sleep 2
            done
            echo "API failed to become healthy"
            docker ps -a | head -20 || true
            docker logs churn-api || true
            exit 1

        - name: Set up Python
          uses: actions/setup-python@v7
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache: "pip"

        - name: Install test dependencies
          run: pip install -r requirements-dev.txt

        - name: Smoke test
          run: pytest tests/smoke/ -v --tb=short
          env:
            API_URL: http://127.0.0.1:8000

        - name: Integration tests
          run: |
            pytest tests/integration/ -v --tb=short \
              --junitxml=test-results/integration.xml
          env:
            API_URL: http://127.0.0.1:8000

        - name: Upload integration test results
          uses: actions/upload-artifact@v7
          if: always()
          with:
            name: integration-test-results
            path: test-results/

        - name: Stop API container
          if: always()
          run: docker rm -f churn-api 2>/dev/null || true